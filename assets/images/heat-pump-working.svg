<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="hpw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F8FD"/>
    </linearGradient>
    <linearGradient id="hpw-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#163A70"/>
      <stop offset="100%" stop-color="#0B2A5B"/>
    </linearGradient>
    <linearGradient id="hpw-hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>
    <linearGradient id="hpw-cold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E5BFF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="hpw-water-hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFA834"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </linearGradient>
    <linearGradient id="hpw-water-cold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1E5BFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#hpw-bg)"/>
  <rect x="25" y="25" width="950" height="600" rx="16" fill="#FFFFFF" stroke="#DCE6F5" stroke-width="2"/>

  <!-- Diagram Title Banner -->
  <rect x="45" y="45" width="910" height="54" rx="8" fill="#0B2A5B"/>
  <text x="65" y="78" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" letter-spacing="1">HEAT PUMP WATER HEATER — WORKING PRINCIPLE</text>
  <text x="750" y="77" fill="#FF8A00" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" letter-spacing="2">AIR-TO-WATER CYCLE</text>

  <!-- 1. EVAPORATOR (Left) -->
  <g id="evaporator" transform="translate(70, 150)">
    <rect x="0" y="0" width="160" height="320" rx="10" fill="#F0F6FF" stroke="#1E5BFF" stroke-width="2.5"/>
    <text x="80" y="30" text-anchor="middle" fill="#0B2A5B" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700">1. EVAPORATOR</text>
    <text x="80" y="48" text-anchor="middle" fill="#627087" font-family="'Poppins', sans-serif" font-size="10">Ambient Heat Absorber</text>

    <!-- Cooling fin coils -->
    <path d="M30 75 Q130 75 130 95 T30 115 T130 135 T30 155 T130 175 T30 195 T130 215 T30 235 T130 255" fill="none" stroke="#1E5BFF" stroke-width="6" stroke-linecap="round"/>

    <!-- Ambient Air Inflow Arrows -->
    <g fill="#1E5BFF" opacity="0.8">
      <path d="M-30 120 L5 120 M-5 115 L5 120 L-5 125" stroke="#1E5BFF" stroke-width="3" fill="none"/>
      <path d="M-30 165 L5 165 M-5 160 L5 165 L-5 170" stroke="#1E5BFF" stroke-width="3" fill="none"/>
      <path d="M-30 210 L5 210 M-5 205 L5 210 L-5 215" stroke="#1E5BFF" stroke-width="3" fill="none"/>
      <text x="-32" y="105" fill="#1E5BFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">FREE AIR HEAT</text>
    </g>

    <!-- Fan Icon -->
    <circle cx="80" cy="285" r="20" fill="#0B2A5B"/>
    <path d="M80 270 C88 275 88 285 80 285 C72 285 72 275 80 270 Z" fill="#FFA834"/>
    <path d="M80 300 C88 295 88 285 80 285 C72 285 72 295 80 300 Z" fill="#FFA834"/>
    <path d="M65 285 C70 277 80 277 80 285 C80 293 70 293 65 285 Z" fill="#FFA834"/>
    <path d="M95 285 C90 277 80 277 80 285 C80 293 90 293 95 285 Z" fill="#FFA834"/>
  </g>

  <!-- 2. COMPRESSOR (Top Center) -->
  <g id="compressor" transform="translate(360, 130)">
    <rect x="0" y="0" width="160" height="110" rx="12" fill="url(#hpw-navy)" stroke="#071C40" stroke-width="2"/>
    <text x="80" y="32" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">2. COMPRESSOR</text>
    <text x="80" y="50" text-anchor="middle" fill="#FFC24A" font-family="'Poppins', sans-serif" font-size="10">High Pressure &amp; Temp</text>

    <!-- Electric Motor / Compression Symbol -->
    <circle cx="80" cy="80" r="18" fill="#1E5BFF"/>
    <polygon points="74,72 88,80 74,88" fill="#FFFFFF"/>
    <!-- Electricity lightning bolt -->
    <path d="M138 20 L132 30 L137 30 L130 42 L142 28 L136 28 Z" fill="#FF8A00"/>
  </g>

  <!-- 3. CONDENSER / HEAT EXCHANGER (Center-Right) -->
  <g id="condenser" transform="translate(560, 240)">
    <rect x="0" y="0" width="150" height="230" rx="10" fill="#FFF5EB" stroke="#FF8A00" stroke-width="2.5"/>
    <text x="75" y="28" text-anchor="middle" fill="#0B2A5B" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">3. CONDENSER</text>
    <text x="75" y="46" text-anchor="middle" fill="#FF8A00" font-family="'Poppins', sans-serif" font-size="10">Heat Transferred to Water</text>

    <!-- Hot refrigerant coil -->
    <path d="M35 70 Q115 70 115 90 T35 110 T115 130 T35 150 T115 170 T35 190" fill="none" stroke="url(#hpw-hot)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 4. EXPANSION VALVE (Bottom Center) -->
  <g id="expansion-valve" transform="translate(360, 480)">
    <polygon points="40,15 120,45 120,15 40,45" fill="#1E5BFF" stroke="#0B2A5B" stroke-width="2"/>
    <rect x="73" y="0" width="14" height="20" fill="#FF8A00"/>
    <text x="80" y="70" text-anchor="middle" fill="#0B2A5B" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700">4. EXPANSION VALVE</text>
    <text x="80" y="86" text-anchor="middle" fill="#627087" font-family="'Poppins', sans-serif" font-size="9.5">Pressure Drop &amp; Cooling</text>
  </g>

  <!-- 5. HOT WATER STORAGE TANK (Far Right) -->
  <g id="water-tank" transform="translate(770, 150)">
    <!-- Tank Body (Insulated SS Cylinder) -->
    <rect x="0" y="20" width="150" height="280" rx="20" fill="#EAF0FA" stroke="#0B2A5B" stroke-width="3"/>
    <path d="M0 50 C40 30 110 30 150 50 L150 20 C110 0 40 0 0 20 Z" fill="#D2E0F5"/>
    <text x="75" y="55" text-anchor="middle" fill="#0B2A5B" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">STORAGE TANK</text>

    <!-- Water Stratification (Cold bottom -> Hot top) -->
    <rect x="8" y="75" width="134" height="110" fill="url(#hpw-water-hot)" opacity="0.85" rx="4"/>
    <rect x="8" y="185" width="134" height="105" fill="url(#hpw-water-cold)" opacity="0.85" rx="4"/>

    <text x="75" y="125" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="15" font-weight="700">HOT WATER</text>
    <text x="75" y="145" text-anchor="middle" fill="#FFF2D6" font-family="'Poppins', sans-serif" font-size="11">55°C – 65°C</text>

    <text x="75" y="235" text-anchor="middle" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="13" font-weight="600">COLD INLET</text>
    <text x="75" y="253" text-anchor="middle" fill="#E0F2FE" font-family="'Poppins', sans-serif" font-size="10">20°C</text>

    <!-- Hot Outlet Pipe to Building -->
    <path d="M150 85 L180 85" stroke="#FF5500" stroke-width="8" stroke-linecap="round"/>
    <text x="145" y="75" fill="#FF5500" font-family="'Poppins', sans-serif" font-size="10" font-weight="700">TO TAPS ↗</text>

    <!-- Cold Inlet Pipe from Mains -->
    <path d="M180 270 L150 270" stroke="#1E5BFF" stroke-width="8" stroke-linecap="round"/>
    <text x="145" y="295" fill="#1E5BFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="700">← MAINS IN</text>
  </g>

  <!-- INTERCONNECTING REFRIGERANT PIPING WITH FLOW ARROWS -->
  <!-- Evaporator to Compressor (Vapor line, cool blue/slate) -->
  <path d="M150 170 L360 170" fill="none" stroke="#1E5BFF" stroke-width="6" stroke-linecap="round"/>
  <polygon points="260,165 275,170 260,175" fill="#1E5BFF"/>
  <text x="250" y="155" fill="#1E5BFF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">Low-temp Gas</text>

  <!-- Compressor to Condenser (High pressure superheated gas, vibrant orange) -->
  <path d="M520 185 L635 185 L635 240" fill="none" stroke="url(#hpw-hot)" stroke-width="7" stroke-linecap="round"/>
  <polygon points="575,180 590,185 575,190" fill="#FF5500"/>
  <text x="545" y="172" fill="#FF5500" font-family="'Poppins', sans-serif" font-size="10" font-weight="700">Hot Vapor 85°C</text>

  <!-- Condenser to Expansion Valve (Warm high pressure liquid, orange-amber) -->
  <path d="M635 470 L635 510 L480 510" fill="none" stroke="#FFA834" stroke-width="6" stroke-linecap="round"/>
  <polygon points="560,515 545,510 560,505" fill="#FFA834"/>
  <text x="525" y="530" fill="#FFA834" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">Warm Liquid</text>

  <!-- Expansion Valve to Evaporator (Cold low pressure liquid/gas, bright blue) -->
  <path d="M360 510 L150 510 L150 470" fill="none" stroke="#00A3FF" stroke-width="6" stroke-linecap="round"/>
  <polygon points="245,515 230,510 245,505" fill="#00A3FF"/>
  <text x="215" y="530" fill="#00A3FF" font-family="'Poppins', sans-serif" font-size="10" font-weight="600">Cold Liquid -5°C</text>

  <!-- Water Circulation Loop between Condenser & Tank -->
  <path d="M710 320 L770 320" fill="none" stroke="#FF6B00" stroke-width="5" stroke-dasharray="6 4"/>
  <polygon points="745,316 755,320 745,324" fill="#FF6B00"/>

  <path d="M770 410 L710 410" fill="none" stroke="#1E5BFF" stroke-width="5" stroke-dasharray="6 4"/>
  <polygon points="735,414 725,410 735,406" fill="#1E5BFF"/>

  <!-- Efficiency Metric Callout Box -->
  <g transform="translate(70, 560)">
    <rect x="0" y="0" width="850" height="50" rx="8" fill="#F4F8FD" stroke="#1E5BFF" stroke-width="1.5"/>
    <text x="20" y="31" fill="#0B2A5B" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700">ENERGY SAVINGS:</text>
    <text x="170" y="31" fill="#FF8A00" font-family="'Montserrat', sans-serif" font-size="15" font-weight="800">1 kW Electric Power In = 4 kW Heat Energy Out (COP 4.0)</text>
    <text x="660" y="31" fill="#1E5BFF" font-family="'Poppins', sans-serif" font-size="12" font-weight="600">Up to 75% Electricity Savings</text>
  </g>
</svg>
